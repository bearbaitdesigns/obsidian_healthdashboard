name: Release

# Publishes a GitHub release with main.js, manifest.json and styles.css, which is what BRAT installs.
# Run it either way:
#  - Actions tab → Release → Run workflow (uses the version in manifest.json as the tag), or
#  - push a tag that matches the version in manifest.json, for example 1.16.4.
on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Work out the version
        id: v
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" dist/main.js dist/manifest.json dist/styles.css --clobber
          else
            gh release create "$V" dist/main.js dist/manifest.json dist/styles.css --target "$GITHUB_SHA" --title "$V" --generate-notes
          fi
