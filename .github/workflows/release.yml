name: Release

# Push a tag that matches the version in manifest.json (for example 1.16.4) to build the plugin
# and publish a GitHub release with main.js, manifest.json and styles.css, which is what BRAT installs.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the tag matches manifest.json
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match manifest version $v"; exit 1; fi
      - name: Build
        run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css --title "$GITHUB_REF_NAME" --generate-notes
          fi
